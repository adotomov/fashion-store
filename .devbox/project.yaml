packageManager: pnpm
workspace:
  appsDir: apps
  packagesDir: libs
endpoints:
  domainSuffix: localhost
  protocol: http
postgres:
  enabled: true
  database: fashion_store
entities:
  - name: api
    kind: app
    path: apps/api
    port: 8080
    runtime: go
    expose: true
    state: local
    createdAt: 2026-10-25T17:15:57.957Z
  - name: webstore-fe
    kind: app
    path: apps/web
    port: 3000
    runtime: node
    expose: true
    state: local
    createdAt: 2026-10-25T17:15:57.957Z
  - name: api-migrate
    kind: job
    path: apps/api
    runtime: none
    expose: false
    state: live
    runs: api
    command:
      - /bin/sh
      - -c
    args:
      - goose -dir /app/db/migrations postgres "$DATABASE_URL" up
    createdAt: 2026-11-01T08:08:45.167Z
    execute: before
  - name: api-backfill-webp
    kind: job
    path: apps/api
    runtime: none
    expose: false
    state: live
    runs: api
    command:
      - /usr/local/bin/backfill-webp
    createdAt: 2026-11-01T08:08:46.554Z
