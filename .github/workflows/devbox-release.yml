name: devbox release

# A push to main tags the next version when its commits call for one (feat: minor, fix: patch, breaking: major),
# then the release runs: release -> dev -> prod. A version tag pushed by hand runs the same release for that tag.
# Every job runs devbox ci inside the devbox/ci image. Prod waits for approval from the prod GitHub Environment's
# required reviewers, and devbox checks the plan hash.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  packages: read # pull the devbox/ci image from GitHub Container Registry

env:
  DEV_WORKLOAD_IDENTITY_PROVIDER: projects/673528779465/locations/global/workloadIdentityPools/github-actions/providers/github
  DEV_DEPLOYER_SA: fs-deployer-dev@project-538051b7-1abf-4eab-94c.iam.gserviceaccount.com
  DEV_REGISTRY_HOST: europe-west1-docker.pkg.dev
  PROD_WORKLOAD_IDENTITY_PROVIDER: projects/399593875435/locations/global/workloadIdentityPools/github-actions/providers/github
  PROD_DEPLOYER_SA: fs-deployer-prod@verani-webstore-prod.iam.gserviceaccount.com
  PROD_REGISTRY_HOST: europe-west1-docker.pkg.dev

jobs:
  version:
    runs-on: ubuntu-latest
    # One version is decided at a time, so two pushes to main never tag the same version.
    concurrency:
      group: devbox-version
      cancel-in-progress: false
    # Pushing the tag needs write access to the repository. The token's own pushes do not start other workflows,
    # so the release below is started from this run rather than from the tag.
    permissions:
      contents: write
      id-token: write
      packages: read
    container:
      image: ghcr.io/adotomov/devbox-ci:latest
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and their commits must be present to read the version
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Tag the next version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A tag pushed by hand is the release: its version is the tag.
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          devbox project version --release --json > release.json
          released=$(jq -r '.data.released' release.json)
          version=$(jq -r '.data.version' release.json)
          if [ "$released" = "true" ]; then
            git push origin "v$version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$released" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Deploys to one environment queue behind each other; a second one waits rather than cancelling.
    concurrency:
      group: devbox-dev-registry
      cancel-in-progress: false
    # The dev environment gives the job its identity: the deployer trusts the environment attribute, not the branch.
    environment: dev
    # Docker is needed for the builds. The image runs as root so it can use the runner's Docker socket.
    container:
      image: ghcr.io/adotomov/devbox-ci:latest
      options: --user 0:0 -v /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag and its commit must be present for the release check
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOYER_SA }}
      - name: Log in to the dev registry
        run: |
          gcloud auth login --cred-file "$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud auth configure-docker "$DEV_REGISTRY_HOST" --quiet
      - name: Release
        run: devbox ci release --version "$VERSION"

  deploy-dev:
    needs: release
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Deploys to one environment queue behind each other; a second one waits rather than cancelling.
    concurrency:
      group: devbox-deploy-dev
      cancel-in-progress: false
    environment: dev
    container:
      image: ghcr.io/adotomov/devbox-ci:latest
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOYER_SA }}
      - name: Log in to the dev registry
        run: |
          gcloud auth login --cred-file "$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud auth configure-docker "$DEV_REGISTRY_HOST" --quiet
      - name: Deploy to dev
        run: devbox ci deploy --version "$VERSION" --env dev
      # The prod gate needs dev's live state, and only this dev identity can read dev. Prod's job passes this file on.
      - name: Save dev's live state for the prod gate
        run: devbox ci observe --env dev --json > dev-live.json
      - uses: actions/upload-artifact@v4
        with:
          name: dev-live
          path: dev-live.json

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    # Deploys to one environment queue behind each other; a second one waits rather than cancelling.
    concurrency:
      group: devbox-deploy-prod
      cancel-in-progress: false
    environment: prod # required reviewers are set on the GitHub Environment
    container:
      image: ghcr.io/adotomov/devbox-ci:latest
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/download-artifact@v4
        with:
          name: dev-live
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.PROD_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.PROD_DEPLOYER_SA }}
      - name: Log in to the prod registry
        run: |
          gcloud auth login --cred-file "$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud auth configure-docker "$PROD_REGISTRY_HOST" --quiet
      - name: Review the plan
        id: plan
        run: |
          devbox ci deploy --version "$VERSION" --env prod --plan --previous-live dev-live.json --json > plan.json
          echo "hash=$(jq -r '.data.planHash' plan.json)" >> "$GITHUB_OUTPUT"
      - name: Deploy to prod
        run: devbox ci deploy --version "$VERSION" --env prod --plan-hash "${{ steps.plan.outputs.hash }}" --previous-live dev-live.json --confirm prod
