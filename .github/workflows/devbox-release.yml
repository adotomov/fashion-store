name: devbox release

# Runs on a version tag. devbox builds each app from the tagged commit, pushes the images to the dev
# repository and labels them with the version. Nothing is deployed here; deploys are separate.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # Workload Identity Federation
  packages: read # pull the devbox/ci image from GitHub Container Registry

env:
  WORKLOAD_IDENTITY_PROVIDER: projects/673528779465/locations/global/workloadIdentityPools/github-actions/providers/github
  DEPLOYER_SA: fs-deployer-dev@project-538051b7-1abf-4eab-94c.iam.gserviceaccount.com
  DEV_REGISTRY_HOST: europe-west1-docker.pkg.dev

jobs:
  release:
    runs-on: ubuntu-latest
    # Docker is needed for the builds, so the job talks to the runner's daemon. The image runs as root for
    # that socket; the pipeline's container is discarded after the job.
    container:
      image: ghcr.io/adotomov/devbox-ci:latest
      options: --user 0:0 -v /var/run/docker.sock:/var/run/docker.sock
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag and its commit must be present for the release check
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}
      - name: Log in to the dev registry
        run: |
          gcloud auth login --cred-file "$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud auth configure-docker "$DEV_REGISTRY_HOST" --quiet
      - name: Release
        run: devbox ci release --version "${GITHUB_REF_NAME#v}"
