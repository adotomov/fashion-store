name: devbox pull request cleanup

# A closed pull request's images are removed at once. An image that a release or another open pull request names is kept.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write
  packages: read

env:
  DEV_WORKLOAD_IDENTITY_PROVIDER: projects/673528779465/locations/global/workloadIdentityPools/github-actions/providers/github
  DEV_DEPLOYER_SA: fs-deployer-dev@project-538051b7-1abf-4eab-94c.iam.gserviceaccount.com
  DEV_REGISTRY_HOST: europe-west1-docker.pkg.dev

jobs:
  prune:
    runs-on: ubuntu-latest
    environment: dev
    container:
      image: ghcr.io/adotomov/devbox-ci:latest
      options: --user 0:0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.DEV_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEV_DEPLOYER_SA }}
      - name: Log in to the dev registry
        run: |
          gcloud auth login --cred-file "$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud auth configure-docker "$DEV_REGISTRY_HOST" --quiet
      - name: Remove the pull request's images
        run: devbox ci prune --pr "${{ github.event.pull_request.number }}"
